<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테트리스</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="game-panel">
        <canvas id="game" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
      </div>

      <aside class="sidebar">
        <h1>테트리스</h1>

        <div class="info-box">
          <div class="row">
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
          <div class="row">
            <span>라인</span>
            <strong id="lines">0</strong>
          </div>
          <div class="row">
            <span>레벨</span>
            <strong id="level">1</strong>
          </div>
        </div>

        <div class="preview-box">
          <h2>다음</h2>
          <canvas id="next" width="120" height="120" aria-label="다음 블록 미리보기"></canvas>
        </div>

        <div class="controls">
          <button id="restartBtn" type="button">다시 시작</button>
        </div>

        <div class="help">
          <p>← → 이동</p>
          <p>↑ 또는 X: 회전</p>
          <p>↓: 빠르게 낙하</p>
          <p>Space: 바로 내려놓기</p>
        </div>
      </aside>
    </div>

    <script src="script.js"></script>
  </body>
</html>
